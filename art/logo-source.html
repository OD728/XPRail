<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="512" height="512"></canvas>
<script>
// XP Rail logo: stacked progress bars in its color sets, like the other logos.
const c = document.getElementById('c');
const g = c.getContext('2d');
const W = 512;

let bg = g.createRadialGradient(256, 236, 20, 256, 256, 380);
bg.addColorStop(0, '#16302a');
bg.addColorStop(0.55, '#0b1513');
bg.addColorStop(1, '#050807');
g.fillStyle = bg;
g.fillRect(0, 0, W, W);

function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// A bar: rim, dark track, rested + quest overlays, gradient fill, ticks, spark.
function bar(x, y, w, h, frac, a, b, opt) {
  opt = opt || {};
  g.save();
  if (opt.gold) {
    g.fillStyle = '#000';
    rr(x - 9, y - 9, w + 18, h + 18, 4); g.fill();
    let gl = g.createLinearGradient(0, y - 7, 0, y + h + 7);
    gl.addColorStop(0, '#f2cc66'); gl.addColorStop(1, '#8c661f');
    g.fillStyle = gl;
    rr(x - 7, y - 7, w + 14, h + 14, 3); g.fill();
  } else {
    g.fillStyle = '#000';
    rr(x - 5, y - 5, w + 10, h + 10, 3); g.fill();
  }
  g.fillStyle = '#0f1011';
  g.fillRect(x, y, w, h);
  const fw = w * frac;
  if (opt.quest) { g.fillStyle = 'rgba(255,150,0,0.55)'; g.fillRect(x + fw, y, w * opt.quest, h); }
  if (opt.rested) { g.fillStyle = 'rgba(0,100,225,0.55)'; g.fillRect(x + fw, y, w * opt.rested, h); }
  let lg = g.createLinearGradient(x, 0, x + fw, 0);
  lg.addColorStop(0, a); lg.addColorStop(1, b);
  g.shadowColor = b; g.shadowBlur = 16;
  g.fillStyle = lg;
  g.fillRect(x, y, fw, h);
  g.shadowBlur = 0;
  let sh = g.createLinearGradient(0, y, 0, y + h);
  sh.addColorStop(0, 'rgba(255,255,255,0.25)');
  sh.addColorStop(0.5, 'rgba(255,255,255,0)');
  g.fillStyle = sh;
  g.fillRect(x, y, fw, h);
  g.fillStyle = 'rgba(0,0,0,0.35)';
  for (let i = 1; i < 10; i++) g.fillRect(Math.round(x + w * i / 10), y, 2, h);
  const sx = x + fw, sy = y + h / 2;
  let sp = g.createRadialGradient(sx, sy, 0, sx, sy, h * 1.4);
  sp.addColorStop(0, 'rgba(255,255,255,0.95)');
  sp.addColorStop(0.35, b.replace('rgb', 'rgba').replace(')', ',0.6)'));
  sp.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = sp;
  g.beginPath(); g.ellipse(sx, sy, h * 0.35, h * 1.3, 0, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'source-over';
  g.restore();
}

const X = 76, BW = 360;
bar(X, 118, BW, 46, 0.72, 'rgb(0,255,255)', 'rgb(255,0,255)', { rested: 0.12, quest: 0.2 });   // Neon
bar(X, 226, BW, 46, 0.52, 'rgb(203,166,247)', 'rgb(245,194,231)', { quest: 0.14 });          // Catppuccin
bar(X, 334, BW, 46, 0.86, 'rgb(148,0,140)', 'rgb(200,60,200)', { gold: true, rested: 0.1 }); // Game XP, gold rim
</script>
</body></html>
